name: ai-trend-radar
on:
  schedule:
    - cron: "7 22 * * *"   # 매일 07:07 KST 수집·관심 항목 텔레그램 알림
    - cron: "41 22 * * 0"  # 월요일 07:41 KST 주간 상위 항목 텔레그램
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: radar
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 수집 또는 주간 요약
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "41 22 * * 0" ]; then python radar.py --weekly; else python radar.py; fi
      - name: 기록 커밋
        run: |
          git config user.name "ai-trend-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "radar: $(TZ=Asia/Seoul date +%F) 수집 기록"
          git push
